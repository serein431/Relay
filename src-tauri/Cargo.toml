[package]
name = "relay-desktop"
version = "0.1.2"
description = "Relay desktop shell"
authors = ["Relay contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "relay_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "relay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
hex = "0.4"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tempfile = "3"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
core-foundation = "=0.10.1"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
security-framework = "=3.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
